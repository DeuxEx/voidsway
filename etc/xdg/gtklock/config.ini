[main]
# 24-timmarsformat (använd %H:%M:%S om du även vill se sekunder)
time-format=%H:%M

# Sökväg till bakgrundsbild (ta bort raden om du bara vill ha enfärgad bakgrund i CSS)
background=/usr/share/backgrounds/default.png

# Dölj "Unlock"-knappen så det bara är en ren textruta för lösenordet
follow-focus=true
