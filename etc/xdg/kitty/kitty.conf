
# ==============================================================================
# 1. SHELL & DEVOPS SSH COMPATIBILITY
# ==============================================================================

# Prevents remote servers/containers from breaking due to missing xterm-kitty terminfo
term xterm-256color

# Update check disabled (managed via Void's xbps instead)
update_check_interval 0

# Disable annoying audio beeps; use a brief visual flash instead
enable_audio_bell yes
visual_bell_duration 0.1
visual_bell_color #f38ba8

#Add this line anywhere in your kitty.conf to prevent Kitty from overwriting your custom title with default command names like sudo:
shell_integration no-title


# Quick font zoom (works on Swedish/ISO keyboards + US keyboards + Numpad)
map ctrl+plus        change_font_size all +1.0
map ctrl+equal       change_font_size all +1.0
map ctrl+kp_add      change_font_size all +1.0

map ctrl+minus       change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0

map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0



# ==============================================================================
# 2. SCROLLBACK & INTERACTIVE VERTICAL SCROLLBAR
# ==============================================================================
# Large scrollback buffer for kubectl logs, Terraform plans, and Ansible output
scrollback_lines 50000

# Opens scrollback in less/pager with Ctrl+Shift+H for fast /regex searching
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER


# Vertical scrollbar on the right edge (visible track + hover expansion)
scrollbar always
scrollbar_width 1.5
scrollbar_hover_width 1.4
scrollbar_handle_opacity 0.6
scrollbar_track_opacity 0.15
scrollbar_radius 0.3
scrollbar_gap 0.1
scrollbar_min_handle_height 1

# ==============================================================================
# 3. FONTS & CURSOR
# ==============================================================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

cursor_shape     block
cursor_blink_interval 0


# ==============================================================================
# 4. WINDOW LAYOUT & WAYLAND (SWAY)
# ==============================================================================
window_padding_width 6
hide_window_decorations yes
background_opacity 0.96
confirm_os_window_close 0

# Clean tab bar (only appears when you open >1 tab with Ctrl+Shift+T)
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted


# ==============================================================================
# 5. CLIPBOARD, MOUSE & URLS
# ==============================================================================
# Automatically copy highlighted text to clipboard (great for IPs, pod names, SHAs)
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
clipboard_max_size 512

copy_on_select yes
strip_trailing_spaces smart
mouse_hide_wait 3.0

# Clickable URLs in terminal output
url_style curly
detect_urls yes


# ==============================================================================
# 6. KEYBINDINGS (DEVOPS WORKFLOW)
# ==============================================================================
# Standard terminal copy/paste without colliding with Ctrl+C (SIGINT) or nano
map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard

# Search scrollback buffer in pager
map ctrl+shift+h show_scrollback

# Quick font zoom for screen sharing on calls
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# Built-in tabs & splits (optional alongside or instead of tmux)
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+enter new_window


# ==============================================================================
# 7. COLOR SCHEME (CATPPUCCIN MOCHA - HIGH CONTRAST)
# ==============================================================================
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

cursor                  #f5e0dc
cursor_text_color       #1e1e2e

url_color               #f5e0dc

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825

# Normal colors
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de

# Bright colors
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

