
output HDMI-A-1 mode 2560x1440 pos 0 0 scale 1
exec_always xrandr --output HDMI-A-1 --primary

##special tricks för steam
workspace 2 output HDMI-A-1

assign [class="steam"] workspace 2
assign [class="steam_app_3642750"] workspace 2

#tvinga Entropia appen i steam in i fullscreen
for_window [class="steam_app_3642750"] fullscreen enable

#ta bort skärmsläckare när något körs i fullscreen
for_window [class=".*"] inhibit_idle fullscreen

for_window [app_id="firefox"] inhibit_idle open
for_window [app_id="steam"] inhibit_idle open

for_window [class="Entropia.*"] floating enable, border none
for_window [title=".*Entropia.*"] floating enable, border none
